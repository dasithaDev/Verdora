name: Verdora API & CI Quality Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main"]

jobs:
  api-integration-tests:
    name: Backend API Integration Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/verdora_test_ci
      JWT_SECRET: ci_test_verdora_jwt_secret_key_2026_super_safe
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm install

      - name: Run Model Schema Tests
        working-directory: server
        run: npm run test:models

      - name: Run Middleware Tests
        working-directory: server
        run: npm run test:middleware

      - name: Run Auth Integration Tests (AUTH-01 to AUTH-16)
        working-directory: server
        run: npm run test:auth

      - name: Run Menu CRUD Tests (MENU-01 to MENU-15)
        working-directory: server
        run: npm run test:menu

      - name: Run Order Lifecycle Tests (ORD-01 to ORD-18)
        working-directory: server
        run: npm run test:orders

  client-build-check:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm install

      - name: Build Production Bundle (Vite)
        working-directory: client
        run: npm run build
